name: Release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'feature/**', develop]

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.CI_FIREBASE_API_KEY || 'AIzaSyDemoBuildOnly000000000000000000000' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.CI_FIREBASE_AUTH_DOMAIN || 'demo-school-study.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.CI_FIREBASE_PROJECT_ID || 'demo-school-study' }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.CI_FIREBASE_STORAGE_BUCKET || 'demo-school-study.firebasestorage.app' }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.CI_FIREBASE_MESSAGING_SENDER_ID || '123456789012' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.CI_FIREBASE_APP_ID || '1:123456789012:web:0123456789abcdef' }}
      NEXT_PUBLIC_SITE_URL: https://school.sbci.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify financial and plan regressions
        run: npm run test:release
      - name: Build production application
        run: npm run build

  gate:
    name: Safe release gate
    runs-on: ubuntu-latest
    if: always()
    needs: [validate]
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Release validation failed or was cancelled. Main must not receive these changes."
            exit 1
          fi
